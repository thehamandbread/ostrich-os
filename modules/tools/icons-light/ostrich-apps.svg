<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The icon for the light style (owner 2026-11-06: F): a flat dark tile, the glyph in the app's bright hue
       (currentColor, bright_apps in light.toml). The dock is dark in both styles, so the tile has a thin
       light rim: without it the tile is the dock's own colour (1.2:1). -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#262a33" stroke="#9aa3b8" stroke-width="2"/>
  <g color="#6fd0c6">
  <g fill="currentColor">
    <rect x="36" y="36" width="14" height="14" rx="4"/>
    <rect x="57" y="36" width="14" height="14" rx="4"/>
    <rect x="78" y="36" width="14" height="14" rx="4"/>
    <rect x="36" y="57" width="14" height="14" rx="4"/>
    <rect x="78" y="57" width="14" height="14" rx="4"/>
    <rect x="36" y="78" width="14" height="14" rx="4"/>
    <rect x="57" y="78" width="14" height="14" rx="4"/>
    <rect x="78" y="78" width="14" height="14" rx="4"/>
  </g>
  <rect x="57" y="57" width="14" height="14" rx="4" fill="currentColor"/>
  </g>
</svg>
