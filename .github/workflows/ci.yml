# .github/workflows/ci.yml: lint, secret scan, and ubuntu:26.04 tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  lint:
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends shellcheck shfmt
      - name: shellcheck
        run: shellcheck install.sh lib/*.sh modules/*/install.sh modules/hardware/*/install.sh modules/gnome/extensions/build.sh modules/gnome/extensions/*/*.sh tests/*.sh tests/vm/*.sh modules/tools/ostrich-icon-style tools/package.sh tools/icons/export.sh .claude/skills/ostrich-design/scripts/*.sh image/*.sh image/firstboot/*.sh .githooks/pre-commit
      - name: shfmt
        run: shfmt -d .
      - name: app id dash rule (the portal accepts a dash only in the last part)
        run: tests/appid-lint.sh "$PWD"
      - name: look rules (sizes, colours, focus, dim-label)
        run: .claude/skills/ostrich-design/scripts/token-lint.sh "$PWD"

  eslint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ESLint (GNOME Shell extensions, pinned node image)
        run: tests/lint-js.sh

  rust:
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (Ubuntu archive)
        # GTK 4, WebKitGTK and libadwaita headers for drawer-host and welcome
        run: apt-get update && apt-get install -y --no-install-recommends cargo rustc rustfmt rust-clippy pkg-config ca-certificates libgtk-4-dev libwebkitgtk-6.0-dev libadwaita-1-dev
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  gitleaks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --exit-code 1

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ubuntu:26.04 test image
        run: docker build -f tests/Dockerfile -t ostrich-os-test .
      - name: Dry run + bats (as non-root user)
        run: docker run --rm ostrich-os-test
