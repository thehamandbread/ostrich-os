<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- tests/vm/mock-bluez.conf: lets tests/vm/mock-bluez.py (run as root in the test VM) own org.bluez.
     bluetooth-test.sh copies it to /etc/dbus-1/system.d/ and removes it again. -->
<busconfig>
  <policy user="root">
    <allow own="org.bluez"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
