// Ubuntu Ostrich portable drive: keep the boot files portable after shim/grub updates
// (/usr/local/sbin/ubuntu-ostrich-portable-esp, from image/portable-esp.sh).
DPkg::Post-Invoke { "if [ -x /usr/local/sbin/ubuntu-ostrich-portable-esp ]; then /usr/local/sbin/ubuntu-ostrich-portable-esp || true; fi"; };
