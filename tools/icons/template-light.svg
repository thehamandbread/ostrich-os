<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The icon for the light style (owner 2026-11-06: F): a flat dark tile, the glyph in the app's bright hue
       (currentColor, bright_@NAME@ in light.toml). The dock is dark in both styles, so the tile has a thin
       light rim: without it the tile is the dock's own colour (1.2:1). -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="{{shell_bottom}}" stroke="{{rim}}" stroke-width="2"/>
  <g color="{{bright_@NAME@}}">
  {{glyph_svg}}
  </g>
</svg>
