# tools/icons/schemes/night-glass.toml: Night Glass, one of the council's three colour schemes (verdict
# 2026-10-24, option C). The same names as palette.toml; PALETTE=this file builds with it.

name = "Night Glass"

# The app icons
shell_top = "#3d4a63"
shell_bottom = "#151b2a"
edge = "#ffffff"
highlight = "#ffffff"
glyph = "#f3f6fb"
accent = "#78aef0" # the icons' accent part

# Glass (tints over the blur), dark shell style, then light
glass_bar = "rgba(10, 14, 24, 0.14)"
glass_menu = "rgba(14, 20, 34, 0.12)"
glass_banner = "rgba(14, 20, 34, 0.16)"
glass_folder = "rgba(18, 24, 38, 0.24)"
glass_border = "rgba(255, 255, 255, 0.09)"
light_glass_menu = "rgba(245, 248, 253, 0.62)"
light_glass_banner = "rgba(245, 248, 253, 0.66)"
light_glass_folder = "rgba(245, 248, 253, 0.4)"
light_glass_border = "rgba(255, 255, 255, 0.55)"
# The hairline round glass that sits on other glass (cards in menus): where one ends
glass_edge = "rgba(255, 255, 255, 0.20)"
light_glass_edge = "rgba(0, 0, 0, 0.14)"
text = "#f3f6fb"
light_text = "#172033"
popup_solid = "rgba(20, 26, 38, 0.92)"
solid = "#141a26"
ws_empty = "rgba(255, 255, 255, 0.80)"

# The desktop (ostrich theme scheme apply)
ui_accent = "#3584e4" # the apps' and GNOME's accent
icon_theme = "Yaru-blue" # -dark is added in dark mode

# Wallpapers: Ubuntu's own, already installed
# Night in both styles: a daylight photo under night glass looked like a mistake (readiness council S9).
wallpaper = "/usr/share/backgrounds/mizuno-as-Big_Dipper.jpg"
wallpaper_dark = "/usr/share/backgrounds/mizuno-as-Big_Dipper.jpg"
