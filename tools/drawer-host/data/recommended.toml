# Recommended sites for Ostrich Drawer, offered by its + button and in Ostrich Settings.
# Each one is checked in the test VM (tests/vm/drawer-test.sh --sites). No icons here: favicons are
# fetched from the site the first time it loads.
#
#   group       messaging | ai | mail | media
#   shape       narrow (phone-like) | wide
#   keep_alive  stays loaded so it can notify
#   status      ok | drm (needs DRM video, which WebKitGTK can't play: listed, not added; opened in
#               its app or the browser instead)
#   app         a DRM site's own app, as a snap name (flatpak: its Flatpak id): opened instead
#   user_agent  only where a site turns WebKit's own user agent away

[[site]]
id = "messages"
name = "Google Messages"
url = "https://messages.google.com/web"
group = "messaging"
shape = "narrow"
keep_alive = true

