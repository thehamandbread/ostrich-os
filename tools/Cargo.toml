# tools/: Rust workspace for Ostrich OS's standalone tools (MIT).
[workspace]
resolver = "2"
members = ["ostrich", "palette", "store-core", "store-tui", "store-gtk", "system-helper", "audio-tune", "drawer-host", "welcome"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.6.0"
repository = "https://github.com/thehamandbread/ostrich-os"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
